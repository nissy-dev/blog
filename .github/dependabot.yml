version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    versioning-strategy: increase
    ignore:
      # pnpm is kept in sync with Node.js through mise.
      - dependency-name: pnpm
    groups:
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - "*"
